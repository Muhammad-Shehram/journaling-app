<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green background with rounded corners (app icon shape) -->
  <rect width="100" height="100" rx="22" fill="#013220"/>

  <!-- Left page -->
  <path d="M 8 18 C 22 14 38 12 50 12 L 50 85 C 36 85 20 83 8 78 Z"
        stroke="#1EDD88" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Right page (mirror) -->
  <path d="M 92 18 C 78 14 62 12 50 12 L 50 85 C 64 85 80 83 92 78 Z"
        stroke="#1EDD88" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Spine -->
  <line x1="50" y1="12" x2="50" y2="85" stroke="#1EDD88" stroke-width="1.5" opacity="0.45"/>

  <!-- Left page writing lines -->
  <line x1="13" y1="31" x2="47" y2="29" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="13" y1="42" x2="47" y2="40" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="13" y1="53" x2="47" y2="51" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="13" y1="64" x2="42" y2="62" stroke="#1EDD88" stroke-width="1.8" opacity="0.22" stroke-linecap="round"/>

  <!-- Right page writing lines -->
  <line x1="53" y1="29" x2="87" y2="31" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="53" y1="40" x2="87" y2="42" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="53" y1="51" x2="87" y2="53" stroke="#1EDD88" stroke-width="1.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="58" y1="62" x2="87" y2="64" stroke="#1EDD88" stroke-width="1.8" opacity="0.22" stroke-linecap="round"/>
</svg>
